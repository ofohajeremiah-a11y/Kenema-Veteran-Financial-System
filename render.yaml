services:
  - type: web
    name: kenema-veteran-financial-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/kenema-data
      - key: ADMIN_PASSWORD
        sync: false